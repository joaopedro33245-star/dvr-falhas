
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Falhas de DVR</title>
<style>
  /* Tema escuro fixo (não muda com o sistema/navegador do usuário) */
  :root {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page-plane:     #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --series-1:       #3987e5;
    --status-good:      #0ca30c;
    --status-warning:   #fab219;
    --status-serious:   #ec835a;
    --status-critical:  #d03b3b;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page-plane);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1360px; margin: 0 auto; padding: 28px 20px 60px; }

  header { margin-bottom: 22px; }
  header h1 { font-size: 22px; margin: 0 0 4px; }
  header p { margin: 0; color: var(--text-secondary); font-size: 14px; }

  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 22px;
  }
  .tile {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .tile .label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .tile .value {
    font-size: 26px;
    font-weight: 600;
    font-variant-numeric: proportional-nums;
  }
  .tile .value.critical { color: var(--status-critical); }
  .tile .sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

  .panel {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .filtros {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--gridline);
    background: var(--surface-1);
    border-radius: 10px;
    border: 1px solid var(--border);
    margin-bottom: 16px;
  }
  .filtros select, .filtros input {
    font: inherit;
    font-size: 13px;
    padding: 7px 10px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--page-plane);
    color: var(--text-primary);
  }
  .filtros input[type="search"] { min-width: 200px; }

  .top-praca-row {
    display: grid;
    grid-template-columns: 120px 1fr 34px;
    align-items: center;
    gap: 10px;
    padding: 6px 16px;
    font-size: 13px;
  }
  .top-praca-row .barra-fundo {
    background: var(--gridline);
    border-radius: 4px;
    height: 8px;
    overflow: hidden;
  }
  .top-praca-row .barra {
    background: var(--series-1);
    height: 100%;
    border-radius: 4px 0 0 4px;
  }
  .top-praca-row .contagem { text-align: right; color: var(--text-secondary); font-variant-numeric: tabular-nums; }

  .secao-titulo {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    padding: 14px 16px 8px;
  }

  .estado-vazio, .estado-carregando, .estado-erro {
    padding: 40px 16px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
  }
  .estado-erro { color: var(--status-critical); }

  /* ---- Quadro (kanban) ---- */
  .quadro {
    display: grid;
    grid-template-columns: repeat(3, minmax(260px, 1fr));
    gap: 14px;
    align-items: start;
  }
  @media (max-width: 860px) {
    .quadro { grid-template-columns: 1fr; }
  }

  .coluna {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    max-height: 78vh;
  }
  .coluna-cabecalho {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--gridline);
    font-size: 13px;
    font-weight: 600;
  }
  .coluna-cabecalho .ponto {
    width: 8px; height: 8px; border-radius: 50%;
    flex: none;
  }
  .coluna-cabecalho .contagem-col {
    margin-left: auto;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    background: var(--page-plane);
    border-radius: 999px;
    padding: 2px 9px;
    font-variant-numeric: tabular-nums;
  }
  .coluna-corpo {
    padding: 10px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .cartao {
    background: var(--page-plane);
    border: 1px solid var(--border);
    border-left-width: 4px;
    border-left-style: solid;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
  }
  .cartao.nova { border-left-color: var(--status-critical); }
  .cartao.andamento { border-left-color: var(--status-warning); }
  .cartao.resolvida { border-left-color: var(--status-good); }

  .cartao .praca {
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 2px;
  }
  .cartao .tipo {
    color: var(--text-secondary);
    margin-bottom: 8px;
  }
  .cartao .linha-detalhe {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 10px;
    color: var(--text-muted);
    font-size: 12px;
    margin-bottom: 8px;
  }
  .cartao .linha-detalhe b { color: var(--text-secondary); font-weight: 600; }

  .cartao .rodape {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--gridline);
  }
  .cartao .tempo {
    font-size: 11px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  .cartao-acoes { display: flex; gap: 6px; }
  .acao-btn {
    font: inherit;
    font-size: 11px;
    padding: 5px 9px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    white-space: nowrap;
  }
  .acao-btn:hover { border-color: var(--series-1); color: var(--series-1); }
  .acao-btn.principal {
    border-color: var(--series-1);
    color: var(--series-1);
  }

  .coluna-vazia {
    padding: 24px 10px;
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Falhas de DVR</h1>
    <p>Eventos de falha reportados pelos DVRs (perda de vídeo, HD, disco, rede) — atualizado automaticamente a partir da caixa de e-mail de alarmes.</p>
  </header>

  <div class="tiles" id="tiles">
    <div class="tile"><div class="label">Carregando...</div><div class="value">—</div></div>
  </div>

  <div class="panel" style="margin-bottom:16px;">
    <div class="secao-titulo">Praças com mais falhas em aberto</div>
    <div id="topPracas"></div>
  </div>

  <div class="filtros">
    <select id="fPraca"><option value="">Todas as praças</option></select>
    <select id="fTipo"><option value="">Todos os tipos</option></select>
    <input type="search" id="fBusca" placeholder="Buscar por IP, canal ou câmera..." />
  </div>

  <div id="quadroContainer">
    <div class="estado-carregando">Carregando eventos...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  // --- Configuracao: troque pela URL e a chave ANON (publica) do seu projeto ---
  var SUPABASE_URL = "https://fxmdsumcqukxuzooiiju.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ4bWRzdW1jcXVreHV6b29paWp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0MTcyNjAsImV4cCI6MjA4ODk5MzI2MH0.qEKKHqvJAt_5Bsk9V5uBI1eN27eWu1wiFhHoFbpI2lo";
  // ------------------------------------------------------------------------

  var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var todasFalhas = [];

  var COLUNAS = [
    { status: "aberta",       classe: "nova",       titulo: "Nova",         corPonto: "var(--status-critical)" },
    { status: "em_andamento", classe: "andamento",  titulo: "Em andamento", corPonto: "var(--status-warning)" },
    { status: "resolvida",    classe: "resolvida",  titulo: "Resolvida",    corPonto: "var(--status-good)" }
  ];

  var elTiles = document.getElementById("tiles");
  var elTopPracas = document.getElementById("topPracas");
  var elQuadro = document.getElementById("quadroContainer");
  var elFPraca = document.getElementById("fPraca");
  var elFTipo = document.getElementById("fTipo");
  var elFBusca = document.getElementById("fBusca");

  function escapeHtml(s) {
    if (s === null || s === undefined) return "";
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function formatarData(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "—";
    return d.toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo" });
  }

  function tempoDecorrido(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "—";
    var diffMs = Date.now() - d.getTime();
    var min = Math.floor(diffMs / 60000);
    if (min < 1) return "agora";
    if (min < 60) return "há " + min + " min";
    var h = Math.floor(min / 60);
    if (h < 24) return "há " + h + "h";
    var dias = Math.floor(h / 24);
    return "há " + dias + "d";
  }

  async function carregar() {
    var { data, error } = await supabase
      .from("dvr_falhas")
      .select("*")
      .order("horario_alarme", { ascending: false, nullsFirst: false })
      .limit(2000);

    if (error) {
      elQuadro.innerHTML = '<div class="estado-erro">Erro ao carregar: ' + escapeHtml(error.message) + '</div>';
      elTiles.innerHTML = '<div class="tile"><div class="label">Erro</div><div class="value critical">—</div></div>';
      return;
    }

    todasFalhas = data || [];
    popularFiltros();
    renderTudo();
  }

  function popularFiltros() {
    var pracaAtual = elFPraca.value, tipoAtual = elFTipo.value;
    var pracas = Array.from(new Set(todasFalhas.map(function (f) { return f.dispositivo; }).filter(Boolean))).sort();
    var tipos = Array.from(new Set(todasFalhas.map(function (f) { return f.tipo_falha; }).filter(Boolean))).sort();

    elFPraca.innerHTML = '<option value="">Todas as praças</option>' +
      pracas.map(function (p) { return '<option value="' + escapeHtml(p) + '">' + escapeHtml(p) + '</option>'; }).join("");
    elFTipo.innerHTML = '<option value="">Todos os tipos</option>' +
      tipos.map(function (t) { return '<option value="' + escapeHtml(t) + '">' + escapeHtml(t) + '</option>'; }).join("");

    elFPraca.value = pracaAtual;
    elFTipo.value = tipoAtual;
  }

  function filtrar() {
    var praca = elFPraca.value, tipo = elFTipo.value;
    var busca = elFBusca.value.trim().toLowerCase();

    return todasFalhas.filter(function (f) {
      if (praca && f.dispositivo !== praca) return false;
      if (tipo && f.tipo_falha !== tipo) return false;
      if (busca) {
        var alvo = [f.ip_dvr, f.canal, f.nome_camera].join(" ").toLowerCase();
        if (alvo.indexOf(busca) === -1) return false;
      }
      return true;
    });
  }

  function renderTiles() {
    var hoje = new Date(); hoje.setHours(0, 0, 0, 0);
    var abertas = todasFalhas.filter(function (f) { return f.status !== "resolvida"; });
    var hojeCount = todasFalhas.filter(function (f) {
      if (!f.horario_alarme) return false;
      return new Date(f.horario_alarme) >= hoje;
    }).length;

    var contagemPorPraca = {};
    abertas.forEach(function (f) {
      var k = f.dispositivo || "(sem praça)";
      contagemPorPraca[k] = (contagemPorPraca[k] || 0) + 1;
    });
    var top = Object.keys(contagemPorPraca).sort(function (a, b) { return contagemPorPraca[b] - contagemPorPraca[a]; })[0];

    elTiles.innerHTML =
      '<div class="tile"><div class="label">Falhas em aberto</div><div class="value ' + (abertas.length ? "critical" : "") + '">' + abertas.length + '</div></div>' +
      '<div class="tile"><div class="label">Eventos hoje</div><div class="value">' + hojeCount + '</div></div>' +
      '<div class="tile"><div class="label">Praça mais afetada</div><div class="value" style="font-size:18px;">' + escapeHtml(top || "—") + '</div><div class="sub">' + (top ? contagemPorPraca[top] + " em aberto" : "") + '</div></div>' +
      '<div class="tile"><div class="label">Total no histórico</div><div class="value">' + todasFalhas.length + '</div></div>';
  }

  function renderTopPracas() {
    var abertas = todasFalhas.filter(function (f) { return f.status !== "resolvida"; });
    var contagem = {};
    abertas.forEach(function (f) {
      var k = f.dispositivo || "(sem praça)";
      contagem[k] = (contagem[k] || 0) + 1;
    });
    var entradas = Object.keys(contagem).map(function (k) { return [k, contagem[k]]; })
      .sort(function (a, b) { return b[1] - a[1]; })
      .slice(0, 6);

    if (!entradas.length) {
      elTopPracas.innerHTML = '<div class="estado-vazio">Nenhuma falha em aberto no momento.</div>';
      return;
    }

    var max = entradas[0][1];
    elTopPracas.innerHTML = entradas.map(function (e) {
      var pct = Math.max(6, Math.round((e[1] / max) * 100));
      return '<div class="top-praca-row">' +
        '<div>' + escapeHtml(e[0]) + '</div>' +
        '<div class="barra-fundo"><div class="barra" style="width:' + pct + '%"></div></div>' +
        '<div class="contagem">' + e[1] + '</div>' +
        '</div>';
    }).join("");
  }

  // Qual botão(ões) aparecem em cada coluna, e pra qual status cada um move o cartão
  function acoesPara(status) {
    if (status === "aberta") {
      return [{ rotulo: "Iniciar atendimento", novoStatus: "em_andamento", principal: true }];
    }
    if (status === "em_andamento") {
      return [
        { rotulo: "Marcar resolvida", novoStatus: "resolvida", principal: true },
        { rotulo: "Voltar pra Nova", novoStatus: "aberta", principal: false }
      ];
    }
    // resolvida
    return [{ rotulo: "Reabrir", novoStatus: "aberta", principal: false }];
  }

  function cartaoHtml(f, classeColuna) {
    var acoes = acoesPara(f.status);
    var botoes = acoes.map(function (a) {
      return '<button class="acao-btn' + (a.principal ? ' principal' : '') + '" data-id="' + f.id + '" data-novo-status="' + a.novoStatus + '">' + a.rotulo + '</button>';
    }).join("");

    var detalhes = [];
    if (f.canal) detalhes.push('<span><b>Canal</b> ' + escapeHtml(f.canal) + '</span>');
    if (f.nome_camera) detalhes.push('<span><b>Câmera</b> ' + escapeHtml(f.nome_camera) + '</span>');
    if (f.ip_dvr) detalhes.push('<span><b>IP</b> ' + escapeHtml(f.ip_dvr) + '</span>');

    return '<div class="cartao ' + classeColuna + '">' +
      '<div class="praca">' + escapeHtml(f.dispositivo || "(sem praça)") + '</div>' +
      '<div class="tipo">' + escapeHtml(f.tipo_falha) + '</div>' +
      (detalhes.length ? '<div class="linha-detalhe">' + detalhes.join("") + '</div>' : '') +
      '<div class="rodape">' +
        '<span class="tempo" title="' + formatarData(f.horario_alarme) + '">' + tempoDecorrido(f.horario_alarme) + '</span>' +
        '<div class="cartao-acoes">' + botoes + '</div>' +
      '</div>' +
      '</div>';
  }

  function renderQuadro() {
    var lista = filtrar();

    var html = '<div class="quadro">' + COLUNAS.map(function (col) {
      var itens = lista.filter(function (f) { return f.status === col.status; });
      var corpo = itens.length
        ? itens.map(function (f) { return cartaoHtml(f, col.classe); }).join("")
        : '<div class="coluna-vazia">Nenhum evento aqui.</div>';

      return '<div class="coluna">' +
        '<div class="coluna-cabecalho">' +
          '<span class="ponto" style="background:' + col.corPonto + '"></span>' +
          col.titulo +
          '<span class="contagem-col">' + itens.length + '</span>' +
        '</div>' +
        '<div class="coluna-corpo">' + corpo + '</div>' +
      '</div>';
    }).join("") + '</div>';

    elQuadro.innerHTML = html;

    Array.prototype.forEach.call(elQuadro.querySelectorAll(".acao-btn"), function (btn) {
      btn.addEventListener("click", async function () {
        var id = btn.getAttribute("data-id");
        var novoStatus = btn.getAttribute("data-novo-status");
        var cartao = btn.closest(".cartao");
        if (cartao) cartao.style.opacity = "0.5";
        Array.prototype.forEach.call((cartao || document).querySelectorAll(".acao-btn"), function (b) { b.disabled = true; });

        var { error } = await supabase.from("dvr_falhas").update({ status: novoStatus }).eq("id", id);
        if (error) {
          alert("Não consegui atualizar: " + error.message);
          if (cartao) cartao.style.opacity = "1";
          Array.prototype.forEach.call((cartao || document).querySelectorAll(".acao-btn"), function (b) { b.disabled = false; });
          return;
        }
        var item = todasFalhas.find(function (f) { return String(f.id) === String(id); });
        if (item) item.status = novoStatus;
        renderTudo();
      });
    });
  }

  function renderTudo() {
    renderTiles();
    renderTopPracas();
    renderQuadro();
  }

  [elFPraca, elFTipo].forEach(function (el) { el.addEventListener("change", renderQuadro); });
  elFBusca.addEventListener("input", renderQuadro);

  carregar();
  setInterval(carregar, 5 * 60 * 1000); // re-busca a cada 5 min
})();
</script>
</body>
</html>

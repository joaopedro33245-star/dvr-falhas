
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Falhas de DVR</title>
<style>
  :root {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --surface-2:      #232322;
    --page-plane:     #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --border:         rgba(255,255,255,0.10);
    --series-1:       #3987e5;
    --series-2:       #8b5cf6;
    --status-good:      #0ca30c;
    --status-warning:   #fab219;
    --status-serious:   #ec835a;
    --status-critical:  #d03b3b;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page-plane);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1500px; margin: 0 auto; padding: 24px 20px 60px; }

  header { margin-bottom: 20px; }
  header h1 { font-size: 22px; margin: 0 0 4px; }
  header p { margin: 0; color: var(--text-secondary); font-size: 14px; }

  /* ---- Tiles ---- */
  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(168px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .tile {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 15px;
  }
  .tile .label { font-size: 12px; color: var(--text-secondary); margin-bottom: 5px; }
  .tile .value { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile .value.sm { font-size: 17px; }
  .tile .value.critical { color: var(--status-critical); }
  .tile .value.warning  { color: var(--status-warning); }
  .tile .value.good     { color: var(--status-good); }
  .tile .sub { font-size: 12px; color: var(--text-muted); margin-top: 3px; }

  /* ---- Abas ---- */
  .abas {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--gridline);
    margin-bottom: 14px;
  }
  .aba {
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 9px 16px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-muted);
    cursor: pointer;
  }
  .aba:hover { color: var(--text-secondary); }
  .aba[aria-selected="true"] {
    color: var(--text-primary);
    border-bottom-color: var(--series-1);
  }
  .aba .cont {
    font-size: 11px;
    font-weight: 600;
    background: var(--surface-2);
    border-radius: 999px;
    padding: 1px 7px;
    margin-left: 6px;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }

  /* ---- Filtros ---- */
  .filtros {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 12px 14px;
    background: var(--surface-1);
    border-radius: 10px;
    border: 1px solid var(--border);
    margin-bottom: 14px;
  }
  .filtros select, .filtros input {
    font: inherit;
    font-size: 13px;
    padding: 7px 10px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--page-plane);
    color: var(--text-primary);
  }
  .filtros input[type="search"] { min-width: 210px; flex: 1; max-width: 340px; }
  .btn {
    font: inherit;
    font-size: 13px;
    padding: 7px 13px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
  }
  .btn:hover { border-color: var(--series-1); color: var(--series-1); }
  .btn.limpar { margin-left: auto; }
  .opcao {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--text-secondary); cursor: pointer; user-select: none;
  }
  .opcao input { accent-color: var(--series-1); width: 15px; height: 15px; }

  /* ---- Card agrupado ---- */
  .resumo-sev { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .pill {
    font-size: 11px; font-weight: 600; padding: 2px 8px;
    border-radius: 999px; border: 1px solid; white-space: nowrap;
  }
  .pill.critica { color: var(--status-critical); border-color: color-mix(in srgb, var(--status-critical) 45%, transparent); }
  .pill.alta    { color: var(--status-serious);  border-color: color-mix(in srgb, var(--status-serious) 45%, transparent); }
  .pill.media   { color: var(--status-warning);  border-color: color-mix(in srgb, var(--status-warning) 45%, transparent); }

  ul.itens-grupo {
    list-style: none; margin: 0 0 8px; padding: 0;
    font-size: 12.5px; color: var(--text-secondary); line-height: 1.55;
  }
  ul.itens-grupo li { display: flex; gap: 7px; align-items: baseline; }
  ul.itens-grupo li .pt { flex: none; width: 6px; height: 6px; border-radius: 50%; }
  ul.itens-grupo li .pt.critica { background: var(--status-critical); }
  ul.itens-grupo li .pt.alta    { background: var(--status-serious); }
  ul.itens-grupo li .pt.media   { background: var(--status-warning); }
  ul.itens-grupo li .mais { color: var(--text-muted); font-style: italic; }

  /* ---- Lista de itens no painel ---- */
  .lista-sel { display: flex; flex-direction: column; gap: 2px; }
  .item-sel {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 9px 11px; border-radius: 8px; cursor: pointer;
    background: var(--page-plane); border: 1px solid var(--border);
  }
  .item-sel:hover { border-color: color-mix(in srgb, var(--series-1) 45%, var(--border)); }
  .item-sel input { margin-top: 2px; accent-color: var(--series-1); width: 15px; height: 15px; flex: none; }
  .item-sel .txt { font-size: 13px; display: flex; flex-direction: column; gap: 1px; }
  .item-sel .txt .tt { color: var(--text-primary); font-weight: 600; }
  .item-sel .txt .dd { color: var(--text-muted); font-size: 12px; line-height: 1.4; }
  .barra-sel {
    display: flex; gap: 12px; align-items: center;
    font-size: 12px; color: var(--text-muted); margin-bottom: 8px;
  }
  .link-sel {
    background: none; border: none; padding: 0; cursor: pointer;
    color: var(--series-1); font: inherit; font-size: 12px;
  }

  .panel {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .estado-vazio, .estado-carregando, .estado-erro {
    padding: 40px 16px; text-align: center; color: var(--text-muted); font-size: 13px;
  }
  .estado-erro { color: var(--status-critical); }

  /* ---- Tabela da frota ---- */
  table.frota { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.frota th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    font-weight: 600;
    padding: 10px 14px;
    border-bottom: 1px solid var(--gridline);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }
  table.frota th:hover { color: var(--text-secondary); }
  table.frota th.num, table.frota td.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.frota td {
    padding: 9px 14px;
    border-bottom: 1px solid var(--gridline);
    color: var(--text-secondary);
  }
  table.frota tr:last-child td { border-bottom: none; }
  table.frota tr:hover td { background: var(--surface-2); }
  table.frota td.nome { color: var(--text-primary); font-weight: 600; }
  table.frota td.mudo { color: var(--text-muted); }

  /* Faixa lateral marcando a linha que precisa de ação — cor + texto, nunca cor sozinha */
  tr.linha-critica td:first-child { box-shadow: inset 3px 0 0 var(--status-critical); }
  tr.linha-atencao td:first-child { box-shadow: inset 3px 0 0 var(--status-warning); }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid;
    white-space: nowrap;
  }
  .chip i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .chip.ok        { color: var(--status-good);     border-color: color-mix(in srgb, var(--status-good) 45%, transparent); }
  .chip.ok i      { background: var(--status-good); }
  .chip.atencao   { color: var(--status-warning);  border-color: color-mix(in srgb, var(--status-warning) 45%, transparent); }
  .chip.atencao i { background: var(--status-warning); }
  .chip.grave     { color: var(--status-critical); border-color: color-mix(in srgb, var(--status-critical) 45%, transparent); }
  .chip.grave i   { background: var(--status-critical); }

  /* ---- Kanban ---- */
  .quadro { display: grid; grid-template-columns: repeat(3, minmax(260px, 1fr)); gap: 14px; align-items: start; }
  @media (max-width: 900px) { .quadro { grid-template-columns: 1fr; } }

  .coluna {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; display: flex; flex-direction: column; max-height: 76vh;
  }
  .coluna-cabecalho {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px; border-bottom: 1px solid var(--gridline);
    font-size: 13px; font-weight: 600;
  }
  .coluna-cabecalho .ponto { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .coluna-cabecalho .contagem-col {
    margin-left: auto; font-size: 12px; font-weight: 600; color: var(--text-secondary);
    background: var(--page-plane); border-radius: 999px; padding: 2px 9px;
    font-variant-numeric: tabular-nums;
  }
  .coluna-corpo { padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }

  .cartao {
    background: var(--page-plane); border: 1px solid var(--border);
    border-left-width: 4px; border-left-style: solid;
    border-radius: 8px; padding: 10px 12px; font-size: 13px;
  }
  .cartao.nova { border-left-color: var(--status-critical); }
  .cartao.andamento { border-left-color: var(--status-warning); }
  .cartao.resolvida { border-left-color: var(--status-good); }
  .cartao.atrasada { background: color-mix(in srgb, var(--status-critical) 8%, var(--page-plane)); }

  .cartao .topo { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 2px; }
  .cartao .praca { font-weight: 700; font-size: 14px; }
  .cartao .tipo { color: var(--text-secondary); margin-bottom: 6px; }
  .cartao .detalhe { color: var(--text-muted); font-size: 12px; line-height: 1.45; margin-bottom: 8px; }
  .cartao .linha-detalhe {
    display: flex; flex-wrap: wrap; gap: 4px 10px;
    color: var(--text-muted); font-size: 12px; margin-bottom: 8px;
  }
  .cartao .linha-detalhe b { color: var(--text-secondary); font-weight: 600; }

  .selo {
    margin-left: auto; flex: none;
    font-size: 10px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase;
    padding: 2px 7px; border-radius: 999px; border: 1px solid; white-space: nowrap;
  }
  .selo.email     { color: var(--series-1);       border-color: color-mix(in srgb, var(--series-1) 45%, transparent); }
  .selo.varredura { color: var(--series-2);       border-color: color-mix(in srgb, var(--series-2) 45%, transparent); }
  .selo.ambas     { color: var(--status-serious); border-color: color-mix(in srgb, var(--status-serious) 45%, transparent); }

  .sla {
    display: inline-block; font-size: 11px; font-weight: 600;
    padding: 1px 7px; border-radius: 999px; margin-bottom: 6px;
    color: var(--status-critical);
    border: 1px solid color-mix(in srgb, var(--status-critical) 45%, transparent);
  }

  .cartao .rodape {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding-top: 8px; border-top: 1px solid var(--gridline);
  }
  .cartao .tempo { font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .cartao .tempo .auto { color: var(--status-good); font-weight: 600; }

  .coluna-vazia { padding: 24px 10px; text-align: center; color: var(--text-muted); font-size: 12px; }

  .rodape-info {
    margin-top: 12px; font-size: 12px; color: var(--text-muted);
  }

  /* ---- Painel de detalhe ---- */
  .fundo-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.65);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 40px 16px; overflow-y: auto; z-index: 50;
  }
  .modal {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 12px; width: 100%; max-width: 620px;
  }
  .modal-cab {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 18px 20px 14px; border-bottom: 1px solid var(--gridline);
  }
  .modal-cab h2 { margin: 0 0 2px; font-size: 18px; }
  .modal-cab .sub { font-size: 13px; color: var(--text-secondary); }
  .fechar {
    margin-left: auto; background: none; border: none; cursor: pointer;
    color: var(--text-muted); font-size: 22px; line-height: 1; padding: 0 4px;
  }
  .fechar:hover { color: var(--text-primary); }

  .modal-corpo { padding: 16px 20px; }
  .modal-secao { margin-bottom: 20px; }
  .modal-secao > h3 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-muted); margin: 0 0 8px; font-weight: 600;
  }
  .campos {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px 16px; font-size: 13px;
  }
  .campo .rot { font-size: 11px; color: var(--text-muted); margin-bottom: 1px; }
  .campo .val { color: var(--text-primary); }

  .detalhe-box {
    background: var(--page-plane); border: 1px solid var(--border);
    border-radius: 8px; padding: 11px 13px; font-size: 13px;
    color: var(--text-secondary); line-height: 1.5;
  }

  .historico {
    background: var(--page-plane); border: 1px solid var(--border);
    border-radius: 8px; padding: 11px 13px; font-size: 12.5px;
    color: var(--text-secondary); line-height: 1.6;
    white-space: pre-wrap; max-height: 180px; overflow-y: auto;
  }

  .antes {
    background: var(--page-plane); border: 1px solid var(--border);
    border-radius: 8px; padding: 11px 13px; margin-bottom: 6px;
  }
  .antes-cab {
    display: flex; flex-wrap: wrap; gap: 4px 14px;
    font-size: 11.5px; color: var(--text-muted); margin-bottom: 5px;
  }
  .antes-nota {
    font-size: 12.5px; color: var(--text-secondary);
    line-height: 1.55; white-space: pre-wrap;
  }

  .modal label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
  .modal input[type="text"], .modal textarea {
    width: 100%; font: inherit; font-size: 13px;
    padding: 9px 11px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--page-plane); color: var(--text-primary);
    resize: vertical;
  }
  .modal textarea { min-height: 84px; }
  .modal input:focus, .modal textarea:focus { outline: none; border-color: var(--series-1); }
  .ajuda { font-size: 11.5px; color: var(--text-muted); margin-top: 5px; }
  .erro-campo { color: var(--status-critical); font-size: 12px; margin-top: 8px; }

  .modal-rodape {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 14px 20px; border-top: 1px solid var(--gridline);
  }
  .btn-acao {
    font: inherit; font-size: 13px; font-weight: 600;
    padding: 9px 15px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--border); background: transparent; color: var(--text-secondary);
  }
  .btn-acao:hover { border-color: var(--series-1); color: var(--series-1); }
  .btn-acao.primario {
    background: var(--series-1); border-color: var(--series-1); color: #fff;
  }
  .btn-acao.primario:hover { filter: brightness(1.1); color: #fff; }
  .btn-acao.resolver {
    background: var(--status-good); border-color: var(--status-good); color: #fff;
  }
  .btn-acao.resolver:hover { filter: brightness(1.1); color: #fff; }
  .btn-acao:disabled { opacity: 0.5; cursor: default; }
  .btn-acao.ao-lado { margin-left: auto; }

  .cartao { cursor: pointer; }
  .cartao:hover { border-color: color-mix(in srgb, var(--series-1) 50%, var(--border)); }
  .marca-nota { color: var(--text-muted); font-size: 11px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Falhas de DVR</h1>
    <p>Verificação direta nos aparelhos a cada rodada, somada aos alarmes por e-mail. O que volta a funcionar é encerrado automaticamente.</p>
  </header>

  <div class="tiles" id="tiles">
    <div class="tile"><div class="label">Carregando...</div><div class="value">—</div></div>
  </div>

  <div class="abas" role="tablist">
    <button class="aba" id="abaFrota" role="tab" aria-selected="true">Frota<span class="cont" id="contFrota">—</span></button>
    <button class="aba" id="abaChamados" role="tab" aria-selected="false">Chamados<span class="cont" id="contChamados">—</span></button>
  </div>

  <div class="filtros">
    <select id="fFilial"><option value="">Todas as filiais</option></select>
    <select id="fPraca"><option value="">Todos os condomínios</option></select>
    <select id="fTipo"><option value="">Todos os tipos</option></select>
    <select id="fSeveridade">
      <option value="">Todas as severidades</option>
      <option value="critica">Só críticas</option>
      <option value="alta">Alta</option>
      <option value="media">Média</option>
    </select>
    <select id="fOrigem">
      <option value="">Todas as origens</option>
      <option value="email">Só e-mail</option>
      <option value="varredura">Só varredura</option>
      <option value="ambas">Confirmadas pelas duas</option>
    </select>
    <input type="search" id="fBusca" placeholder="Buscar por IP, canal ou câmera..." />
    <label class="opcao"><input type="checkbox" id="fAgrupar" checked /> Agrupar por condomínio</label>
    <button class="btn" id="btnExportar">Exportar CSV</button>
    <button class="btn limpar" id="btnLimpar">Limpar filtros</button>
  </div>

  <div id="painelFrota"><div class="estado-carregando">Carregando frota...</div></div>
  <div id="painelChamados" hidden></div>

  <div class="rodape-info" id="rodapeInfo"></div>
</div>

<div id="modal"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  // --- Configuracao ---------------------------------------------------------
  var SUPABASE_URL = "https://fxmdsumcqukxuzooiiju.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ4bWRzdW1jcXVreHV6b29paWp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0MTcyNjAsImV4cCI6MjA4ODk5MzI2MH0.qEKKHqvJAt_5Bsk9V5uBI1eN27eWu1wiFhHoFbpI2lo";

  // Horas sem alguém assumir o chamado antes de ele contar como atrasado.
  var SLA_HORAS = 4;
  // Minutos sem varrer antes de o aparelho contar como desatualizado.
  var VARREDURA_ATRASADA_MIN = 150;
  // ------------------------------------------------------------------------

  var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var falhas = [];
  var aparelhos = [];
  var ultimaVarredura = null;
  var abaAtiva = "frota";
  var ordem = { campo: "prioridade", desc: true };

  var STATUS_OCULTOS = ["arquivada"];

  var COLUNAS = [
    { status: "aberta",       classe: "nova",      titulo: "Nova",         cor: "var(--status-critical)" },
    { status: "em_andamento", classe: "andamento", titulo: "Em andamento", cor: "var(--status-warning)" },
    { status: "resolvida",    classe: "resolvida", titulo: "Resolvida",    cor: "var(--status-good)" }
  ];

  var ROTULO_ORIGEM = { email: "E-mail", varredura: "Varredura", ambas: "E-mail + varredura" };

  var el = function (id) { return document.getElementById(id); };
  var elTiles = el("tiles"), elFrota = el("painelFrota"), elChamados = el("painelChamados");
  var elRodape = el("rodapeInfo");
  var fFilial = el("fFilial"), fPraca = el("fPraca"), fTipo = el("fTipo");
  var fSeveridade = el("fSeveridade"), fOrigem = el("fOrigem"), fBusca = el("fBusca");

  function escapeHtml(s) {
    if (s === null || s === undefined) return "";
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function formatarData(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    return isNaN(d.getTime()) ? "—" : d.toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo" });
  }
  function horasDesde(iso) {
    if (!iso) return null;
    var d = new Date(iso);
    return isNaN(d.getTime()) ? null : (Date.now() - d.getTime()) / 3600000;
  }
  function tempoDecorrido(iso) {
    var h = horasDesde(iso);
    if (h === null) return "—";
    var min = Math.floor(h * 60);
    if (min < 1) return "agora";
    if (min < 60) return "há " + min + " min";
    if (h < 24) return "há " + Math.floor(h) + "h";
    return "há " + Math.floor(h / 24) + "d";
  }

  function visivel(f) { return STATUS_OCULTOS.indexOf(f.status) === -1; }
  function emAberto(f) { return visivel(f) && f.status !== "resolvida"; }
  function origemDe(f) { return f.origem || "email"; }
  function atrasada(f) {
    return f.status === "aberta" && (horasDesde(f.horario_alarme) || 0) >= SLA_HORAS;
  }

  // --- Carga ----------------------------------------------------------------
  async function carregar() {
    var rFalhas = await supabase.from("dvr_falhas").select("*")
      .not("status", "in", "(" + STATUS_OCULTOS.join(",") + ")")
      .order("horario_alarme", { ascending: false, nullsFirst: false })
      .limit(5000);

    if (rFalhas.error) {
      elFrota.innerHTML = '<div class="estado-erro">Erro ao carregar: ' + escapeHtml(rFalhas.error.message) + '</div>';
      return;
    }
    falhas = (rFalhas.data || []).filter(visivel);

    var rAp = await supabase.from("dvr_aparelhos").select("*").limit(2000);
    aparelhos = (!rAp.error && rAp.data) ? rAp.data : [];

    var rVar = await supabase.from("dvr_varreduras").select("*")
      .order("executado_em", { ascending: false }).limit(1);
    ultimaVarredura = (!rVar.error && rVar.data && rVar.data[0]) ? rVar.data[0] : null;

    popularFiltros();
    render();
  }

  function unicos(lista, chave) {
    return Array.from(new Set(lista.map(function (x) { return x[chave]; }).filter(Boolean))).sort();
  }

  function popularFiltros() {
    var manter = { filial: fFilial.value, praca: fPraca.value, tipo: fTipo.value };

    var filiais = Array.from(new Set(
      unicos(aparelhos, "filial").concat(unicos(falhas, "filial"))
    )).sort();
    var pracas = Array.from(new Set(
      unicos(aparelhos, "nome").concat(unicos(falhas, "dispositivo"))
    )).sort();
    var tipos = unicos(falhas, "tipo_falha");

    function preencher(sel, itens, rotuloTodos) {
      sel.innerHTML = '<option value="">' + rotuloTodos + '</option>' + itens.map(function (i) {
        return '<option value="' + escapeHtml(i) + '">' + escapeHtml(i) + '</option>';
      }).join("");
    }
    preencher(fFilial, filiais, "Todas as filiais");
    preencher(fPraca, pracas, "Todos os condomínios");
    preencher(fTipo, tipos, "Todos os tipos");

    fFilial.value = manter.filial; fPraca.value = manter.praca; fTipo.value = manter.tipo;
  }

  // --- Filtros --------------------------------------------------------------
  function falhasFiltradas() {
    var filial = fFilial.value, praca = fPraca.value, tipo = fTipo.value;
    var sev = fSeveridade.value, origem = fOrigem.value;
    var busca = fBusca.value.trim().toLowerCase();

    return falhas.filter(function (f) {
      if (filial && f.filial !== filial) return false;
      if (praca && f.dispositivo !== praca) return false;
      if (tipo && f.tipo_falha !== tipo) return false;
      if (sev && f.severidade !== sev) return false;
      if (origem && origemDe(f) !== origem) return false;
      if (busca) {
        var alvo = [f.ip_dvr, f.canal, f.nome_camera, f.detalhe, f.dispositivo].join(" ").toLowerCase();
        if (alvo.indexOf(busca) === -1) return false;
      }
      return true;
    });
  }

  function frotaFiltrada() {
    var filial = fFilial.value, praca = fPraca.value;
    var busca = fBusca.value.trim().toLowerCase();

    var abertasPorDvr = {};
    var criticasPorDvr = {};
    falhas.filter(emAberto).forEach(function (f) {
      var k = f.dispositivo || "";
      abertasPorDvr[k] = (abertasPorDvr[k] || 0) + 1;
      if (f.severidade === "critica") criticasPorDvr[k] = (criticasPorDvr[k] || 0) + 1;
    });

    return aparelhos.filter(function (a) {
      if (filial && a.filial !== filial) return false;
      if (praca && a.nome !== praca) return false;
      if (busca) {
        var alvo = [a.nome, a.ip_dvr, a.filial, a.modelo].join(" ").toLowerCase();
        if (alvo.indexOf(busca) === -1) return false;
      }
      return true;
    }).map(function (a) {
      var min = (horasDesde(a.ultima_varredura) || 0) * 60;
      return {
        dvr: a,
        abertas: abertasPorDvr[a.nome] || 0,
        criticas: criticasPorDvr[a.nome] || 0,
        minSemVarrer: min,
        desatualizado: min > VARREDURA_ATRASADA_MIN
      };
    });
  }

  function ordenarFrota(linhas) {
    var c = ordem.campo, dir = ordem.desc ? -1 : 1;
    return linhas.slice().sort(function (x, y) {
      function val(l) {
        if (c === "nome") return (l.dvr.nome || "").toLowerCase();
        if (c === "filial") return (l.dvr.filial || "").toLowerCase();
        if (c === "canais") return l.dvr.canais_verificados || 0;
        if (c === "abertas") return l.abertas;
        if (c === "varredura") return l.minSemVarrer;
        // prioridade: inacessível > crítica > falha > desatualizado > ok
        var p = 0;
        if (l.dvr.acessivel === false) p += 10000;
        p += l.criticas * 100 + l.abertas;
        if (l.desatualizado) p += 50;
        return p;
      }
      var a = val(x), b = val(y);
      if (a === b) return (x.dvr.nome || "").localeCompare(y.dvr.nome || "");
      return a > b ? dir : -dir;
    });
  }

  // --- Tiles ----------------------------------------------------------------
  function renderTiles() {
    var abertas = falhas.filter(emAberto);
    var criticas = abertas.filter(function (f) { return f.severidade === "critica"; });
    var atrasadas = abertas.filter(atrasada);
    var inacessiveis = aparelhos.filter(function (a) { return a.acessivel === false; });
    var desatualizados = aparelhos.filter(function (a) {
      return (horasDesde(a.ultima_varredura) || 0) * 60 > VARREDURA_ATRASADA_MIN;
    });

    var tileVarredura = ultimaVarredura
      ? '<div class="tile"><div class="label">Última varredura</div>' +
        '<div class="value sm" title="' + formatarData(ultimaVarredura.executado_em) + '">' +
        escapeHtml(tempoDecorrido(ultimaVarredura.executado_em)) + '</div>' +
        '<div class="sub">modo ' + escapeHtml(ultimaVarredura.modo || "—") +
        ' · ' + (ultimaVarredura.fechadas || 0) + ' fechada(s)</div></div>'
      : '<div class="tile"><div class="label">Última varredura</div>' +
        '<div class="value sm" style="color:var(--text-muted)">—</div>' +
        '<div class="sub">coletor ainda não executou</div></div>';

    elTiles.innerHTML =
      '<div class="tile"><div class="label">Falhas em aberto</div><div class="value ' +
        (abertas.length ? "critical" : "good") + '">' + abertas.length + '</div></div>' +
      '<div class="tile"><div class="label">Críticas</div><div class="value ' +
        (criticas.length ? "critical" : "good") + '">' + criticas.length + '</div></div>' +
      '<div class="tile"><div class="label">Sem atendimento</div><div class="value ' +
        (atrasadas.length ? "warning" : "good") + '">' + atrasadas.length + '</div>' +
        '<div class="sub">abertas há mais de ' + SLA_HORAS + 'h</div></div>' +
      '<div class="tile"><div class="label">DVRs monitorados</div><div class="value">' +
        aparelhos.length + '</div></div>' +
      '<div class="tile"><div class="label">DVRs sem resposta</div><div class="value ' +
        (inacessiveis.length ? "critical" : "good") + '">' + inacessiveis.length + '</div></div>' +
      '<div class="tile"><div class="label">Sem varrer</div><div class="value ' +
        (desatualizados.length ? "warning" : "good") + '">' + desatualizados.length + '</div>' +
        '<div class="sub">há mais de ' + Math.round(VARREDURA_ATRASADA_MIN / 60) + 'h</div></div>' +
      tileVarredura;
  }

  // --- Aba Frota ------------------------------------------------------------
  var COLS_FROTA = [
    { campo: "nome",      titulo: "Condomínio" },
    { campo: "filial",    titulo: "Filial" },
    { campo: null,        titulo: "IP" },
    { campo: null,        titulo: "Situação" },
    { campo: "canais",    titulo: "Canais", num: true },
    { campo: "abertas",   titulo: "Falhas", num: true },
    { campo: "varredura", titulo: "Última varredura", num: true }
  ];

  function situacaoDe(l) {
    if (l.dvr.acessivel === false) return { classe: "grave", texto: "Sem resposta", linha: "linha-critica" };
    if (l.criticas > 0) return { classe: "grave", texto: l.criticas + " crítica(s)", linha: "linha-critica" };
    if (l.desatualizado) return { classe: "atencao", texto: "Sem varrer", linha: "linha-atencao" };
    if (l.abertas > 0) return { classe: "atencao", texto: "Com falha", linha: "linha-atencao" };
    return { classe: "ok", texto: "Normal", linha: "" };
  }

  function renderFrota() {
    var linhas = ordenarFrota(frotaFiltrada());
    el("contFrota").textContent = linhas.length;

    if (!aparelhos.length) {
      elFrota.innerHTML = '<div class="panel"><div class="estado-vazio">' +
        'Nenhum aparelho registrado ainda. Rode <b>sql/04-aparelhos.sql</b> no Supabase e ' +
        'aguarde a próxima varredura.</div></div>';
      return;
    }
    if (!linhas.length) {
      elFrota.innerHTML = '<div class="panel"><div class="estado-vazio">Nenhum aparelho com esses filtros.</div></div>';
      return;
    }

    var cab = COLS_FROTA.map(function (c) {
      var seta = (c.campo && ordem.campo === c.campo) ? (ordem.desc ? " ↓" : " ↑") : "";
      return '<th class="' + (c.num ? "num" : "") + '"' +
             (c.campo ? ' data-ordenar="' + c.campo + '"' : '') + '>' +
             escapeHtml(c.titulo) + seta + '</th>';
    }).join("");

    var corpo = linhas.map(function (l) {
      var s = situacaoDe(l);
      var d = l.dvr;
      return '<tr class="' + s.linha + '">' +
        '<td class="nome">' + escapeHtml(d.nome || "(sem nome)") + '</td>' +
        '<td>' + escapeHtml(d.filial || "—") + '</td>' +
        '<td class="mudo">' + escapeHtml(d.ip_dvr || "—") + '</td>' +
        '<td><span class="chip ' + s.classe + '"><i></i>' + escapeHtml(s.texto) + '</span>' +
          (d.acessivel === false && d.motivo
            ? '<div class="mudo" style="font-size:11px;margin-top:3px">' + escapeHtml(d.motivo) + '</div>' : '') +
        '</td>' +
        '<td class="num">' + (d.canais_verificados != null ? d.canais_verificados : "—") + '</td>' +
        '<td class="num">' + (l.abertas || "—") + '</td>' +
        '<td class="num" title="' + formatarData(d.ultima_varredura) + '">' +
          escapeHtml(tempoDecorrido(d.ultima_varredura)) + '</td>' +
      '</tr>';
    }).join("");

    elFrota.innerHTML = '<div class="panel"><table class="frota"><thead><tr>' + cab +
      '</tr></thead><tbody>' + corpo + '</tbody></table></div>';

    Array.prototype.forEach.call(elFrota.querySelectorAll("th[data-ordenar]"), function (th) {
      th.addEventListener("click", function () {
        var campo = th.getAttribute("data-ordenar");
        if (ordem.campo === campo) ordem.desc = !ordem.desc;
        else { ordem.campo = campo; ordem.desc = true; }
        renderFrota();
      });
    });
  }

  // --- Aba Chamados ---------------------------------------------------------
  function cartaoHtml(f, classeColuna) {
    var detalhes = [];
    if (f.canal) detalhes.push('<span><b>Canal</b> ' + escapeHtml(f.canal) + '</span>');
    if (f.nome_camera) detalhes.push('<span><b>Câmera</b> ' + escapeHtml(f.nome_camera) + '</span>');
    if (f.ip_dvr) detalhes.push('<span><b>IP</b> ' + escapeHtml(f.ip_dvr) + '</span>');

    var origem = origemDe(f);
    var selo = '<span class="selo ' + origem + '">' + escapeHtml(ROTULO_ORIGEM[origem] || origem) + '</span>';

    var h = horasDesde(f.horario_alarme);
    var slaBadge = atrasada(f)
      ? '<div class="sla">⏰ sem atendimento há ' + Math.floor(h) + 'h</div>' : '';

    var marcaAuto = f.resolvido_por === "varredura" ? ' · <span class="auto">fechada pela varredura</span>' : '';
    var visto = f.visto_em ? ' · confirmada ' + escapeHtml(tempoDecorrido(f.visto_em)) : '';

    var rodapeDir = f.atendido_por
      ? '<span class="marca-nota">' + escapeHtml(f.atendido_por) +
        (f.observacao ? ' · 📝' : '') + '</span>'
      : '<span class="marca-nota">abrir ›</span>';

    return '<div class="cartao ' + classeColuna + (atrasada(f) ? ' atrasada' : '') +
      '" data-id="' + f.id + '" role="button" tabindex="0">' +
      '<div class="topo"><div class="praca">' + escapeHtml(f.dispositivo || "(sem praça)") + '</div>' + selo + '</div>' +
      (f.filial ? '<div class="mudo" style="font-size:11px;color:var(--text-muted)">' + escapeHtml(f.filial) + '</div>' : '') +
      slaBadge +
      '<div class="tipo">' + escapeHtml(f.tipo_falha) + '</div>' +
      (f.detalhe ? '<div class="detalhe">' + escapeHtml(f.detalhe) + '</div>' : '') +
      (detalhes.length ? '<div class="linha-detalhe">' + detalhes.join("") + '</div>' : '') +
      '<div class="rodape"><span class="tempo" title="' + formatarData(f.horario_alarme) + '">' +
        tempoDecorrido(f.horario_alarme) + visto + marcaAuto + '</span>' +
        rodapeDir + '</div>' +
    '</div>';
  }

  var PESO_SEV = { critica: 3, alta: 2, media: 1 };
  var ROTULO_SEV = { critica: "crítica", alta: "alta", media: "média" };
  var sevTexto = function (s) { return ROTULO_SEV[s] || s || "—"; };

  /** Um card por condomínio, reunindo todos os problemas dele naquela coluna. */
  function cartaoGrupoHtml(itens, classeColuna) {
    var f0 = itens[0];
    var maisAntiga = itens.reduce(function (a, b) {
      return new Date(a.horario_alarme || 0) <= new Date(b.horario_alarme || 0) ? a : b;
    });
    var temAtraso = itens.some(atrasada);

    var cont = { critica: 0, alta: 0, media: 0 };
    itens.forEach(function (f) { if (cont[f.severidade] !== undefined) cont[f.severidade]++; });
    var pills = ["critica", "alta", "media"].filter(function (s) { return cont[s]; })
      .map(function (s) {
        var rot = s === "critica" ? "crítica" : s;
        return '<span class="pill ' + s + '">' + cont[s] + ' ' + rot + (cont[s] > 1 ? 's' : '') + '</span>';
      }).join("");

    var ordenados = itens.slice().sort(function (a, b) {
      return (PESO_SEV[b.severidade] || 0) - (PESO_SEV[a.severidade] || 0);
    });
    var linhas = ordenados.slice(0, 4).map(function (f) {
      var onde = f.canal ? "Canal " + f.canal + (f.nome_camera ? " · " + escapeHtml(f.nome_camera) : "") : "Aparelho";
      return '<li><span class="pt ' + escapeHtml(f.severidade || "media") + '"></span>' +
        '<span>' + escapeHtml(f.tipo_falha) + ' — <span style="color:var(--text-muted)">' + onde + '</span></span></li>';
    }).join("");
    if (ordenados.length > 4) {
      linhas += '<li><span class="pt" style="background:transparent"></span>' +
        '<span class="mais">e mais ' + (ordenados.length - 4) + '...</span></li>';
    }

    var origens = Array.from(new Set(itens.map(origemDe)));
    var origem = origens.length > 1 ? "ambas" : origens[0];

    var h = horasDesde(maisAntiga.horario_alarme);
    var sla = temAtraso ? '<div class="sla">⏰ mais antigo há ' + Math.floor(h) + 'h</div>' : '';
    var quem = f0.atendido_por
      ? '<span class="marca-nota">' + escapeHtml(f0.atendido_por) + '</span>'
      : '<span class="marca-nota">abrir ›</span>';

    return '<div class="cartao ' + classeColuna + (temAtraso ? ' atrasada' : '') +
      '" data-ids="' + itens.map(function (f) { return f.id; }).join(",") + '" role="button" tabindex="0">' +
      '<div class="topo"><div class="praca">' + escapeHtml(f0.dispositivo || "(sem praça)") + '</div>' +
        '<span class="selo ' + origem + '">' + escapeHtml(ROTULO_ORIGEM[origem] || origem) + '</span></div>' +
      (f0.filial ? '<div style="font-size:11px;color:var(--text-muted)">' + escapeHtml(f0.filial) + '</div>' : '') +
      sla +
      '<div class="tipo" style="margin:6px 0 7px">' + itens.length + ' problema' +
        (itens.length > 1 ? 's' : '') + '</div>' +
      '<div class="resumo-sev">' + pills + '</div>' +
      '<ul class="itens-grupo">' + linhas + '</ul>' +
      '<div class="rodape"><span class="tempo" title="' + formatarData(maisAntiga.horario_alarme) + '">' +
        'mais antigo ' + tempoDecorrido(maisAntiga.horario_alarme) + '</span>' + quem + '</div>' +
    '</div>';
  }

  function renderChamados() {
    var lista = falhasFiltradas();
    var agrupar = el("fAgrupar").checked;
    el("contChamados").textContent = lista.filter(emAberto).length;

    // Mais antigos primeiro: a fila de atendimento é por idade, não por chegada.
    var ordenada = lista.slice().sort(function (a, b) {
      return new Date(a.horario_alarme || 0) - new Date(b.horario_alarme || 0);
    });

    elChamados.innerHTML = '<div class="quadro">' + COLUNAS.map(function (col) {
      var itens = ordenada.filter(function (f) { return f.status === col.status; });
      if (col.status === "resolvida") itens = itens.slice().reverse().slice(0, 200);

      var corpo, contagem = itens.length;

      if (agrupar) {
        var grupos = [];
        var indice = {};
        itens.forEach(function (f) {
          var k = f.dispositivo || "(sem praça)";
          if (indice[k] === undefined) { indice[k] = grupos.length; grupos.push([]); }
          grupos[indice[k]].push(f);
        });
        contagem = grupos.length;
        corpo = grupos.length
          ? grupos.map(function (g) { return cartaoGrupoHtml(g, col.classe); }).join("")
          : '<div class="coluna-vazia">Nenhum evento aqui.</div>';
      } else {
        corpo = itens.length
          ? itens.map(function (f) { return cartaoHtml(f, col.classe); }).join("")
          : '<div class="coluna-vazia">Nenhum evento aqui.</div>';
      }

      return '<div class="coluna"><div class="coluna-cabecalho">' +
        '<span class="ponto" style="background:' + col.cor + '"></span>' + col.titulo +
        '<span class="contagem-col" title="' + (agrupar ? itens.length + ' problema(s)' : '') + '">' +
        contagem + '</span></div>' +
        '<div class="coluna-corpo">' + corpo + '</div></div>';
    }).join("") + '</div>';

    Array.prototype.forEach.call(elChamados.querySelectorAll(".cartao"), function (c) {
      function abrir() {
        var ids = c.getAttribute("data-ids") || c.getAttribute("data-id") || "";
        abrirDetalhe(ids.split(",").filter(Boolean));
      }
      c.addEventListener("click", abrir);
      c.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); abrir(); }
      });
    });
  }

  // --- Painel de detalhe e atendimento --------------------------------------
  var elModal = el("modal");

  function operadorSalvo() {
    try { return localStorage.getItem("dvr_operador") || ""; } catch (e) { return ""; }
  }
  function salvarOperador(nome) {
    try { localStorage.setItem("dvr_operador", nome); } catch (e) { /* modo privado */ }
  }

  function campo(rot, val) {
    return '<div class="campo"><div class="rot">' + escapeHtml(rot) + '</div>' +
           '<div class="val">' + escapeHtml(val === null || val === undefined || val === "" ? "—" : val) +
           '</div></div>';
  }

  function abrirDetalhe(ids) {
    var lista = (Array.isArray(ids) ? ids : [ids]).map(function (id) {
      return falhas.find(function (x) { return String(x.id) === String(id); });
    }).filter(Boolean);
    if (!lista.length) return;

    var f = lista[0];
    var grupo = lista.length > 1;
    var ap = aparelhos.find(function (a) { return a.nome === f.dispositivo; }) || null;
    var origem = origemDe(f);

    var infoAparelho = ap
      ? '<div class="campos">' +
          campo("Situação na última varredura", ap.acessivel === false ? "Sem resposta" : "Respondendo") +
          campo("Última varredura", tempoDecorrido(ap.ultima_varredura) + " (" + formatarData(ap.ultima_varredura) + ")") +
          campo("Modo da varredura", ap.ultimo_modo) +
          campo("Canais verificados", ap.canais_verificados) +
          campo("Modelo", ap.modelo) +
          campo("Firmware", ap.firmware) +
          (ap.motivo ? campo("Motivo da falha de acesso", ap.motivo) : "") +
        '</div>'
      : '<div class="ajuda">Este aparelho ainda não foi registrado pela varredura direta. ' +
        'Provavelmente a falha veio por e-mail e o DVR não está no devices.csv.</div>';

    var acoes = "";
    if (f.status === "aberta") {
      acoes = '<button class="btn-acao primario" data-acao="em_andamento">Assumir atendimento</button>' +
              '<button class="btn-acao resolver" data-acao="resolvida">Registrar e resolver</button>';
    } else if (f.status === "em_andamento") {
      acoes = '<button class="btn-acao resolver" data-acao="resolvida">Registrar e resolver</button>' +
              '<button class="btn-acao" data-acao="aberta">Devolver para Nova</button>';
    } else {
      acoes = '<button class="btn-acao" data-acao="aberta">Reabrir</button>';
    }

    // Num grupo, o operador escolhe quais problemas o atendimento cobre.
    var blocoItens;
    if (grupo) {
      var ordenados = lista.slice().sort(function (a, b) {
        return (PESO_SEV[b.severidade] || 0) - (PESO_SEV[a.severidade] || 0);
      });
      blocoItens =
        '<div class="modal-secao"><h3>' + lista.length + ' problemas neste condomínio</h3>' +
        '<div class="barra-sel"><span id="contSel"></span>' +
          '<button class="link-sel" id="selTodos">Marcar todos</button>' +
          '<button class="link-sel" id="selNenhum">Desmarcar todos</button></div>' +
        '<div class="lista-sel">' + ordenados.map(function (x) {
          var onde = x.canal
            ? "Canal " + x.canal + (x.nome_camera ? " · " + x.nome_camera : "")
            : "Aparelho inteiro";
          return '<label class="item-sel"><input type="checkbox" class="chk-item" value="' + x.id + '" checked />' +
            '<span class="txt"><span class="tt">' + escapeHtml(x.tipo_falha) + '</span>' +
            '<span class="dd">' + escapeHtml(onde) + ' · ' + escapeHtml(sevTexto(x.severidade)) +
            ' · aberto ' + escapeHtml(tempoDecorrido(x.horario_alarme)) + '</span>' +
            (x.detalhe ? '<span class="dd">' + escapeHtml(x.detalhe) + '</span>' : '') +
            '</span></label>';
        }).join("") + '</div></div>';
    } else {
      blocoItens =
        (f.detalhe ? '<div class="modal-secao"><div class="detalhe-box">' +
          escapeHtml(f.detalhe) + '</div></div>' : '') +
        '<div class="modal-secao"><h3>Chamado</h3><div class="campos">' +
          campo("Canal", f.canal) + campo("Câmera", f.nome_camera) +
          campo("IP do DVR", f.ip_dvr) + campo("Severidade", sevTexto(f.severidade)) +
          campo("Origem", ROTULO_ORIGEM[origem] || origem) +
          campo("Aberto em", formatarData(f.horario_alarme)) +
          campo("Confirmado pela varredura", f.visto_em ? tempoDecorrido(f.visto_em) : "—") +
          campo("Assumido por", f.atendido_por) +
        '</div></div>';
    }

    elModal.innerHTML =
      '<div class="fundo-modal" id="fundoModal"><div class="modal" role="dialog" aria-modal="true">' +
        '<div class="modal-cab">' +
          '<div><h2>' + escapeHtml(f.dispositivo || "(sem praça)") + '</h2>' +
          '<div class="sub">' + (grupo ? lista.length + ' problemas em aberto' : escapeHtml(f.tipo_falha)) +
            (f.filial ? ' · ' + escapeHtml(f.filial) : '') + '</div></div>' +
          '<button class="fechar" id="btnFechar" title="Fechar">×</button>' +
        '</div>' +

        '<div class="modal-corpo">' + blocoItens +

          '<div class="modal-secao"><h3>Varredura do aparelho</h3>' + infoAparelho + '</div>' +

          (!grupo && f.observacao
            ? '<div class="modal-secao"><h3>Histórico deste chamado</h3>' +
              '<div class="historico">' + escapeHtml(f.observacao) + '</div></div>'
            : '') +

          '<div class="modal-secao" id="secaoReincidencia" hidden>' +
            '<h3 id="tituloReincidencia">Já aconteceu antes</h3>' +
            '<div id="listaReincidencia"></div></div>' +

          '<div class="modal-secao"><h3>Registrar atendimento</h3>' +
            '<label for="mOperador">Quem está atendendo</label>' +
            '<input type="text" id="mOperador" value="' + escapeHtml(operadorSalvo()) +
              '" placeholder="Seu nome" />' +
            '<div style="height:12px"></div>' +
            '<label for="mNota">O que foi feito</label>' +
            '<textarea id="mNota" placeholder="Ex.: HD substituído, gravação reativada e testada no canal 4."></textarea>' +
            '<div class="ajuda">Obrigatório ao resolver. Cada anotação fica guardada com data e autor' +
              (grupo ? ', em cada um dos problemas marcados acima.' : '.') + '</div>' +
            '<div class="erro-campo" id="mErro" hidden></div>' +
          '</div>' +
        '</div>' +

        '<div class="modal-rodape">' + acoes +
          '<button class="btn-acao ao-lado" id="btnCancelar">Fechar</button></div>' +
      '</div></div>';

    var fundo = el("fundoModal");
    function fechar() { elModal.innerHTML = ""; document.removeEventListener("keydown", esc); }
    function esc(e) { if (e.key === "Escape") fechar(); }
    document.addEventListener("keydown", esc);

    el("btnFechar").addEventListener("click", fechar);
    el("btnCancelar").addEventListener("click", fechar);
    fundo.addEventListener("click", function (e) { if (e.target === fundo) fechar(); });

    function marcados() {
      if (!grupo) return lista;
      var ids = Array.prototype.map.call(
        elModal.querySelectorAll(".chk-item:checked"), function (c) { return c.value; });
      return lista.filter(function (x) { return ids.indexOf(String(x.id)) !== -1; });
    }

    if (grupo) {
      var atualizarContagem = function () {
        el("contSel").textContent = marcados().length + " de " + lista.length + " selecionados";
      };
      Array.prototype.forEach.call(elModal.querySelectorAll(".chk-item"), function (c) {
        c.addEventListener("change", atualizarContagem);
      });
      el("selTodos").addEventListener("click", function () {
        Array.prototype.forEach.call(elModal.querySelectorAll(".chk-item"), function (c) { c.checked = true; });
        atualizarContagem();
      });
      el("selNenhum").addEventListener("click", function () {
        Array.prototype.forEach.call(elModal.querySelectorAll(".chk-item"), function (c) { c.checked = false; });
        atualizarContagem();
      });
      atualizarContagem();
    }

    Array.prototype.forEach.call(elModal.querySelectorAll("[data-acao]"), function (btn) {
      btn.addEventListener("click", function () {
        gravarAtendimento(marcados(), btn.getAttribute("data-acao"), fechar, btn);
      });
    });

    if (!operadorSalvo()) el("mOperador").focus(); else el("mNota").focus();

    carregarReincidencia(f, grupo);
  }

  /**
   * Busca no banco o que já foi feito neste mesmo ponto antes.
   *
   * Quando uma falha volta, o coletor abre um card novo e limpo — o que foi
   * feito da última vez fica no card antigo, já resolvido. Sem isto, o
   * operador refaz a investigação inteira a cada reincidência.
   */
  async function carregarReincidencia(f, grupo) {
    var secao = el("secaoReincidencia");
    if (!secao) return;

    // Os filtros vêm antes de order/limit: encadear depois funciona em algumas
    // versões do cliente e quebra em outras.
    var q = supabase.from("dvr_falhas")
      .select("id,canal,nome_camera,tipo_falha,horario_alarme,resolvido_em,atendido_por,observacao,resolvido_por")
      .eq("status", "resolvida")
      .neq("id", f.id);

    if (f.ip_dvr) q = q.eq("ip_dvr", f.ip_dvr);
    else q = q.eq("dispositivo", f.dispositivo);

    // Num chamado único, o histórico é do mesmo ponto exato.
    // Num grupo, é a memória do condomínio inteiro.
    if (!grupo) {
      q = q.eq("tipo_falha", f.tipo_falha);
      if (f.canal === null || f.canal === undefined) q = q.is("canal", null);
      else q = q.eq("canal", f.canal);
    }

    var r = await q.order("horario_alarme", { ascending: false }).limit(6);
    if (r.error || !r.data || !r.data.length) return;

    // Só interessa o que alguém registrou; fechamento automático não ensina nada.
    var comRegistro = r.data.filter(function (x) { return x.observacao; });
    if (!comRegistro.length) return;

    el("tituloReincidencia").textContent = grupo
      ? "Atendimentos anteriores neste condomínio"
      : "Já aconteceu antes neste ponto — " + comRegistro.length + " vez(es) com registro";

    el("listaReincidencia").innerHTML = comRegistro.map(function (x) {
      var onde = grupo
        ? escapeHtml(x.tipo_falha) + (x.canal ? " · canal " + escapeHtml(x.canal) : "")
        : "";
      return '<div class="antes">' +
        '<div class="antes-cab">' +
          '<span>' + escapeHtml(formatarData(x.horario_alarme)) + '</span>' +
          (onde ? '<span>' + onde + '</span>' : '') +
          (x.atendido_por ? '<span>' + escapeHtml(x.atendido_por) + '</span>' : '') +
        '</div>' +
        '<div class="antes-nota">' + escapeHtml(x.observacao) + '</div>' +
      '</div>';
    }).join("");

    secao.hidden = false;
  }

  async function gravarAtendimento(alvos, novoStatus, fechar, btn) {
    var operador = el("mOperador").value.trim();
    var nota = el("mNota").value.trim();
    var erro = el("mErro");

    function falhar(msg) {
      erro.textContent = msg; erro.hidden = false;
    }
    erro.hidden = true;

    if (!alvos.length) return falhar("Marque pelo menos um problema.");
    if (!operador) return falhar("Informe quem está atendendo.");
    if (novoStatus === "resolvida" && !nota) {
      return falhar("Descreva o que foi feito antes de resolver — é esse registro que fica para a equipe.");
    }

    salvarOperador(operador);

    var agora = new Date();
    var carimbo = agora.toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo",
      day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    var rotuloAcao = novoStatus === "em_andamento" ? "assumiu"
      : novoStatus === "resolvida" ? "resolveu" : "devolveu para Nova";

    var linha = "[" + carimbo + "] " + operador + " " + rotuloAcao +
      (alvos.length > 1 ? " (" + alvos.length + " problemas juntos)" : "") +
      (nota ? ": " + nota : "");

    Array.prototype.forEach.call(elModal.querySelectorAll("button"), function (b) { b.disabled = true; });
    var rotuloOriginal = btn.textContent;
    btn.textContent = "Salvando...";

    // Cada chamado guarda o próprio histórico, por isso um update por linha.
    var patches = alvos.map(function (x) {
      var p = {
        status: novoStatus,
        observacao: x.observacao ? (x.observacao + "\n" + linha) : linha,
        atendido_por: operador,
        resolvido_por: null
      };
      if (novoStatus === "em_andamento" && !x.atendido_em) p.atendido_em = agora.toISOString();
      if (novoStatus === "resolvida") p.resolvido_em = agora.toISOString();
      return p;
    });

    var resultados = await Promise.all(alvos.map(function (x, i) {
      return supabase.from("dvr_falhas").update(patches[i]).eq("id", x.id);
    }));

    var falhou = resultados.filter(function (r) { return r.error; });
    if (falhou.length) {
      Array.prototype.forEach.call(elModal.querySelectorAll("button"), function (b) { b.disabled = false; });
      btn.textContent = rotuloOriginal;
      return falhar(falhou.length + " de " + alvos.length + " não salvaram: " + falhou[0].error.message);
    }

    alvos.forEach(function (x, i) { Object.assign(x, patches[i]); });
    fechar();
    render();
  }

  // --- Exportar -------------------------------------------------------------
  function baixarCsv(nome, cabecalho, linhas) {
    var esc = function (v) {
      var s = (v === null || v === undefined) ? "" : String(v);
      return '"' + s.replace(/"/g, '""') + '"';
    };
    var csv = [cabecalho.map(esc).join(";")]
      .concat(linhas.map(function (l) { return l.map(esc).join(";"); })).join("\r\n");
    // BOM para o Excel em pt-BR reconhecer os acentos
    var blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = nome;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function exportar() {
    var hoje = new Date().toISOString().slice(0, 10);
    if (abaAtiva === "frota") {
      var linhas = ordenarFrota(frotaFiltrada()).map(function (l) {
        return [l.dvr.nome, l.dvr.filial, l.dvr.ip_dvr, situacaoDe(l).texto,
                l.dvr.canais_verificados, l.abertas, l.criticas,
                formatarData(l.dvr.ultima_varredura), l.dvr.motivo || ""];
      });
      baixarCsv("frota-dvr-" + hoje + ".csv",
        ["Condomínio", "Filial", "IP", "Situação", "Canais", "Falhas abertas",
         "Críticas", "Última varredura", "Motivo"], linhas);
    } else {
      var l2 = falhasFiltradas().map(function (f) {
        return [f.dispositivo, f.filial, f.ip_dvr, f.canal, f.nome_camera, f.tipo_falha,
                f.severidade, f.status, ROTULO_ORIGEM[origemDe(f)], f.detalhe,
                formatarData(f.horario_alarme), f.resolvido_por || ""];
      });
      baixarCsv("chamados-dvr-" + hoje + ".csv",
        ["Condomínio", "Filial", "IP", "Canal", "Câmera", "Tipo", "Severidade",
         "Status", "Origem", "Detalhe", "Aberta em", "Resolvido por"], l2);
    }
  }

  // --- Render + eventos -----------------------------------------------------
  function render() {
    renderTiles();
    if (abaAtiva === "frota") renderFrota(); else renderChamados();
    el("contFrota").textContent = frotaFiltrada().length;
    el("contChamados").textContent = falhasFiltradas().filter(emAberto).length;
    elRodape.textContent = "Atualiza sozinho a cada 5 minutos. " +
      aparelhos.length + " aparelho(s) monitorado(s), " +
      falhas.filter(emAberto).length + " falha(s) em aberto.";
  }

  function trocarAba(qual) {
    abaAtiva = qual;
    el("abaFrota").setAttribute("aria-selected", String(qual === "frota"));
    el("abaChamados").setAttribute("aria-selected", String(qual === "chamados"));
    elFrota.hidden = qual !== "frota";
    elChamados.hidden = qual !== "chamados";
    render();
  }

  el("abaFrota").addEventListener("click", function () { trocarAba("frota"); });
  el("abaChamados").addEventListener("click", function () { trocarAba("chamados"); });
  el("btnExportar").addEventListener("click", exportar);
  el("btnLimpar").addEventListener("click", function () {
    [fFilial, fPraca, fTipo, fSeveridade, fOrigem].forEach(function (s) { s.value = ""; });
    fBusca.value = "";
    render();
  });

  [fFilial, fPraca, fTipo, fSeveridade, fOrigem, el("fAgrupar")].forEach(function (s) {
    s.addEventListener("change", render);
  });
  fBusca.addEventListener("input", render);

  carregar();
  setInterval(carregar, 5 * 60 * 1000);
})();
</script>

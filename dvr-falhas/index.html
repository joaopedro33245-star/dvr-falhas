<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Falhas de DVR</title>
<style>
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page-plane:     #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --series-1:       #2a78d6;
    --status-good:      #0ca30c;
    --status-warning:   #fab219;
    --status-serious:   #ec835a;
    --status-critical:  #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page-plane:     #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --series-1:       #3987e5;
      --status-good:      #0ca30c;
      --status-warning:   #fab219;
      --status-serious:   #ec835a;
      --status-critical:  #d03b3b;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page-plane);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 60px; }

  header { margin-bottom: 22px; }
  header h1 { font-size: 22px; margin: 0 0 4px; }
  header p { margin: 0; color: var(--text-secondary); font-size: 14px; }

  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 22px;
  }
  .tile {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .tile .label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .tile .value {
    font-size: 26px;
    font-weight: 600;
    font-variant-numeric: proportional-nums;
  }
  .tile .value.critical { color: var(--status-critical); }
  .tile .sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

  .panel {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .filtros {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--gridline);
  }
  .filtros select, .filtros input {
    font: inherit;
    font-size: 13px;
    padding: 7px 10px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--page-plane);
    color: var(--text-primary);
  }
  .filtros input[type="search"] { min-width: 200px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left;
    font-weight: 600;
    color: var(--text-secondary);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .02em;
    padding: 10px 14px;
    border-bottom: 1px solid var(--gridline);
    white-space: nowrap;
  }
  tbody td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--gridline);
    vertical-align: top;
    font-variant-numeric: tabular-nums;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--page-plane); }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
  }
  .badge.aberta { color: var(--status-critical); background: color-mix(in srgb, var(--status-critical) 14%, transparent); }
  .badge.resolvida { color: var(--status-good); background: color-mix(in srgb, var(--status-good) 14%, transparent); }
  .badge svg { width: 10px; height: 10px; }

  .acao-btn {
    font: inherit;
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
  }
  .acao-btn:hover { border-color: var(--series-1); color: var(--series-1); }

  .top-praca-row {
    display: grid;
    grid-template-columns: 120px 1fr 34px;
    align-items: center;
    gap: 10px;
    padding: 6px 16px;
    font-size: 13px;
  }
  .top-praca-row .barra-fundo {
    background: var(--gridline);
    border-radius: 4px;
    height: 8px;
    overflow: hidden;
  }
  .top-praca-row .barra {
    background: var(--series-1);
    height: 100%;
    border-radius: 4px 0 0 4px;
  }
  .top-praca-row .contagem { text-align: right; color: var(--text-secondary); font-variant-numeric: tabular-nums; }

  .secao-titulo {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    padding: 14px 16px 8px;
  }

  .estado-vazio, .estado-carregando, .estado-erro {
    padding: 40px 16px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
  }
  .estado-erro { color: var(--status-critical); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Falhas de DVR</h1>
    <p>Eventos de falha reportados pelos DVRs (perda de vídeo, HD, disco, rede) — atualizado automaticamente a partir da caixa de e-mail de alarmes.</p>
  </header>

  <div class="tiles" id="tiles">
    <div class="tile"><div class="label">Carregando...</div><div class="value">—</div></div>
  </div>

  <div class="panel" style="margin-bottom:22px;">
    <div class="secao-titulo">Praças com mais falhas em aberto</div>
    <div id="topPracas"></div>
  </div>

  <div class="panel">
    <div class="filtros">
      <select id="fPraca"><option value="">Todas as praças</option></select>
      <select id="fTipo"><option value="">Todos os tipos</option></select>
      <select id="fStatus">
        <option value="">Todos os status</option>
        <option value="aberta" selected>Aberta</option>
        <option value="resolvida">Resolvida</option>
      </select>
      <input type="search" id="fBusca" placeholder="Buscar por IP, canal ou câmera..." />
    </div>
    <div id="tabelaContainer">
      <div class="estado-carregando">Carregando eventos...</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  // --- Configuracao: troque pela URL e a chave ANON (publica) do seu projeto ---
  var SUPABASE_URL = "https://fxmdsumcqukxuzooiiju.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ4bWRzdW1jcXVreHV6b29paWp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0MTcyNjAsImV4cCI6MjA4ODk5MzI2MH0.qEKKHqvJAt_5Bsk9V5uBI1eN27eWu1wiFhHoFbpI2lo";
  // ------------------------------------------------------------------------

  var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var todasFalhas = [];

  var elTiles = document.getElementById("tiles");
  var elTopPracas = document.getElementById("topPracas");
  var elTabela = document.getElementById("tabelaContainer");
  var elFPraca = document.getElementById("fPraca");
  var elFTipo = document.getElementById("fTipo");
  var elFStatus = document.getElementById("fStatus");
  var elFBusca = document.getElementById("fBusca");

  function escapeHtml(s) {
    if (s === null || s === undefined) return "";
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function formatarData(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "—";
    return d.toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo" });
  }

  function iconeBadge(status) {
    if (status === "resolvida") {
      return '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3 3 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    }
    return '<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="2"/><path d="M8 5v3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="8" cy="11" r="1" fill="currentColor"/></svg>';
  }

  async function carregar() {
    var { data, error } = await supabase
      .from("dvr_falhas")
      .select("*")
      .order("horario_alarme", { ascending: false, nullsFirst: false })
      .limit(2000);

    if (error) {
      elTabela.innerHTML = '<div class="estado-erro">Erro ao carregar: ' + escapeHtml(error.message) + '</div>';
      elTiles.innerHTML = '<div class="tile"><div class="label">Erro</div><div class="value critical">—</div></div>';
      return;
    }

    todasFalhas = data || [];
    popularFiltros();
    renderTudo();
  }

  function popularFiltros() {
    var pracas = Array.from(new Set(todasFalhas.map(function (f) { return f.dispositivo; }).filter(Boolean))).sort();
    var tipos = Array.from(new Set(todasFalhas.map(function (f) { return f.tipo_falha; }).filter(Boolean))).sort();

    pracas.forEach(function (p) {
      var opt = document.createElement("option");
      opt.value = p; opt.textContent = p;
      elFPraca.appendChild(opt);
    });
    tipos.forEach(function (t) {
      var opt = document.createElement("option");
      opt.value = t; opt.textContent = t;
      elFTipo.appendChild(opt);
    });
  }

  function filtrar() {
    var praca = elFPraca.value, tipo = elFTipo.value, status = elFStatus.value;
    var busca = elFBusca.value.trim().toLowerCase();

    return todasFalhas.filter(function (f) {
      if (praca && f.dispositivo !== praca) return false;
      if (tipo && f.tipo_falha !== tipo) return false;
      if (status && f.status !== status) return false;
      if (busca) {
        var alvo = [f.ip_dvr, f.canal, f.nome_camera].join(" ").toLowerCase();
        if (alvo.indexOf(busca) === -1) return false;
      }
      return true;
    });
  }

  function renderTiles(lista) {
    var hoje = new Date(); hoje.setHours(0, 0, 0, 0);
    var abertas = todasFalhas.filter(function (f) { return f.status === "aberta"; });
    var hojeCount = todasFalhas.filter(function (f) {
      if (!f.horario_alarme) return false;
      return new Date(f.horario_alarme) >= hoje;
    }).length;

    var contagemPorPraca = {};
    abertas.forEach(function (f) {
      var k = f.dispositivo || "(sem praça)";
      contagemPorPraca[k] = (contagemPorPraca[k] || 0) + 1;
    });
    var top = Object.keys(contagemPorPraca).sort(function (a, b) { return contagemPorPraca[b] - contagemPorPraca[a]; })[0];

    elTiles.innerHTML =
      '<div class="tile"><div class="label">Falhas em aberto</div><div class="value ' + (abertas.length ? "critical" : "") + '">' + abertas.length + '</div></div>' +
      '<div class="tile"><div class="label">Eventos hoje</div><div class="value">' + hojeCount + '</div></div>' +
      '<div class="tile"><div class="label">Praça mais afetada</div><div class="value" style="font-size:18px;">' + escapeHtml(top || "—") + '</div><div class="sub">' + (top ? contagemPorPraca[top] + " em aberto" : "") + '</div></div>' +
      '<div class="tile"><div class="label">Total no histórico</div><div class="value">' + todasFalhas.length + '</div></div>';
  }

  function renderTopPracas() {
    var abertas = todasFalhas.filter(function (f) { return f.status === "aberta"; });
    var contagem = {};
    abertas.forEach(function (f) {
      var k = f.dispositivo || "(sem praça)";
      contagem[k] = (contagem[k] || 0) + 1;
    });
    var entradas = Object.keys(contagem).map(function (k) { return [k, contagem[k]]; })
      .sort(function (a, b) { return b[1] - a[1]; })
      .slice(0, 6);

    if (!entradas.length) {
      elTopPracas.innerHTML = '<div class="estado-vazio">Nenhuma falha em aberto no momento.</div>';
      return;
    }

    var max = entradas[0][1];
    elTopPracas.innerHTML = entradas.map(function (e) {
      var pct = Math.max(6, Math.round((e[1] / max) * 100));
      return '<div class="top-praca-row">' +
        '<div>' + escapeHtml(e[0]) + '</div>' +
        '<div class="barra-fundo"><div class="barra" style="width:' + pct + '%"></div></div>' +
        '<div class="contagem">' + e[1] + '</div>' +
        '</div>';
    }).join("");
  }

  function renderTabela() {
    var lista = filtrar();

    if (!lista.length) {
      elTabela.innerHTML = '<div class="estado-vazio">Nenhum evento encontrado com esses filtros.</div>';
      return;
    }

    var linhas = lista.map(function (f) {
      var statusClasse = f.status === "resolvida" ? "resolvida" : "aberta";
      var statusTexto = f.status === "resolvida" ? "Resolvida" : "Aberta";
      var proximaAcao = f.status === "resolvida" ? "Reabrir" : "Marcar resolvida";
      return '<tr>' +
        '<td>' + formatarData(f.horario_alarme) + '</td>' +
        '<td>' + escapeHtml(f.tipo_falha) + '</td>' +
        '<td>' + escapeHtml(f.dispositivo) + '</td>' +
        '<td>' + escapeHtml(f.canal) + '</td>' +
        '<td>' + escapeHtml(f.nome_camera) + '</td>' +
        '<td>' + escapeHtml(f.ip_dvr) + '</td>' +
        '<td><span class="badge ' + statusClasse + '">' + iconeBadge(f.status) + statusTexto + '</span></td>' +
        '<td><button class="acao-btn" data-id="' + f.id + '" data-status="' + f.status + '">' + proximaAcao + '</button></td>' +
        '</tr>';
    }).join("");

    elTabela.innerHTML =
      '<table><thead><tr>' +
      '<th>Horário</th><th>Tipo</th><th>Praça</th><th>Canal</th><th>Câmera</th><th>IP</th><th>Status</th><th></th>' +
      '</tr></thead><tbody>' + linhas + '</tbody></table>';

    Array.prototype.forEach.call(elTabela.querySelectorAll(".acao-btn"), function (btn) {
      btn.addEventListener("click", async function () {
        var id = btn.getAttribute("data-id");
        var statusAtual = btn.getAttribute("data-status");
        var novoStatus = statusAtual === "resolvida" ? "aberta" : "resolvida";
        btn.disabled = true;
        var { error } = await supabase.from("dvr_falhas").update({ status: novoStatus }).eq("id", id);
        if (error) {
          alert("Não consegui atualizar: " + error.message);
          btn.disabled = false;
          return;
        }
        var item = todasFalhas.find(function (f) { return String(f.id) === String(id); });
        if (item) item.status = novoStatus;
        renderTudo();
      });
    });
  }

  function renderTudo() {
    renderTiles();
    renderTopPracas();
    renderTabela();
  }

  [elFPraca, elFTipo, elFStatus].forEach(function (el) { el.addEventListener("change", renderTabela); });
  elFBusca.addEventListener("input", renderTabela);

  carregar();
  setInterval(carregar, 5 * 60 * 1000); // re-busca a cada 5 min
})();
</script>
</body>
</html>
